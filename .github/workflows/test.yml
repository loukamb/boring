name: test

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            gcc \
            luajit \
            pkgconf \
            wlroots0.20 \
            wlr-protocols \
            wayland-protocols \
            libvips \
            xorg-xwayland

      - name: Run Lua tests
        run: luajit tests/run.lua

      - name: Generate Wayland FFI bindings
        run: |
          BORING_DEBUG=1 luajit -e 'package.path="./?/init.lua;./?.lua;"..package.path; require("shared.wayland.server")'
          BORING_DEBUG=1 luajit -e 'package.path="./?/init.lua;./?.lua;"..package.path; require("shared.wayland.client")'

      - name: Headless compositor smoke test
        run: |
          mkdir -p /tmp/boring-runtime
          chmod 700 /tmp/boring-runtime
          set +e
          XDG_RUNTIME_DIR=/tmp/boring-runtime WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 timeout 5s luajit switch.lua compositor
          code=$?
          test "$code" -eq 124
